<!DOCTYPE html>
<html>
<head>
    <title>Star and Moon Photography</title>
    <style>
        body {
            background-color: #1d1d1d;
        }
        #container { 
            /* background-color: Gray; */
            width:800px;
            margin: 50px auto;
        }

        .camera-controls {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
        }

        .camera-controls h2 {
            color: gray;
            margin: 0 0 10px 0;
        }

        .exposure-button {
            display: inline-block;
            margin: 6px;
            width: 132px;
            height: 40px;
            background-color: gray;
            font-size: 15px;
            text-transform: uppercase;
            font-weight: bold;
        }

        #capture-button{
            display: block;
            margin: 6px;
            width: 132px;
            height: 60px;
            background-color: gray;
            font-size: 15px;
            text-transform: uppercase;
            font-weight: bold;
            float: right;
        }

        #last-capture-container { 
            float: right;
            margin-right: 21px;
            overflow:hidden;
        }

        #last-capture-container img{ 
            width:100%;
        }

        #stream-container iframe, #last-capture-container{
            width: 365px;
            margin-left: 19px;
            height: 206px;
        }
        #stream-container iframe:nth-child(2), #last-capture-container{
            border: 4px solid #b80000;
        }

        #stream-container {
            width:100%;
            display: inline-block;
            position: relative;
            /* background-color: black; */
        }

        .half-panel{
            width: 49%;
            display: inline-block;
        }
        .half-panel button{
            width: 168px;
            display: inline-block;
            height: 79px;
            margin: 0px auto;
            background-color: gray;
            font-size: 56px;
        }
        .half-panel:nth-child(1) button{
            margin-left: 28px;
        }

        .half-panel .hidden{
            display:none;
        }

        .half-panel h1{
            text-align: center;
            color:gray;
        }

        #console {
            background-color:black;
            color:white;
            width: 794px;
            height: 161px;
            border-top: 24px solid #dedede;
        }

        #shutdown-button {
            background-color: #b80000 !important;
            color: white !important;
            padding: 15px 30px !important;
            font-size: 18px !important;
            font-weight: bold !important;
            border: none !important;
            border-radius: 5px !important;
            cursor: pointer !important;
            margin: 10px 0 !important;
            transition: all 0.3s ease !important;
        }

        #shutdown-button:hover {
            background-color: #8b0000 !important;
            transform: scale(1.05) !important;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3) !important;
        }

        #shutdown-button:disabled {
            background-color: #666 !important;
            cursor: not-allowed !important;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>
</head>
<body>

    <div id="container">

        <div id="debug-controls">   
        </div>

        <div id="stream-container">
            <iframe src="http://frodo.local:8889/cam1/"></iframe>
            <!-- Add transparent overlay for click detection -->
            <div id="cam1-overlay" style="
                position: absolute;
                top: 0;
                left: 0;
                width: 365px;
                height: 206px;
                background: transparent;
                cursor: crosshair;
                z-index: 10;
                display: none;
            "></div>
            <div style="
                position: absolute;
                border: 1px solid red;
                width: 9px;
                height: 6px;
                top: 97px;
                left: 196px;
            "></div>
            <div id="last-capture-container">
                <img id="last-capture" src="http://frodo.local:8000/captures/cam0_last.jpg">
            </div>
            <iframe src="http://frodo.local:8889/cam0/"></iframe>
        </div>

        <!-- Camera Controls -->
        <div class="camera-controls">
            <h2>Camera 0 Controls</h2>
            <!-- <button class="exposure-button" onclick="sendCommand('exposeoutdoor', 0)">Daylight</button>
            <button class="exposure-button" onclick="sendCommand('exposeinside', 0)">Inside</button>-->
            <button class="exposure-button" onclick="sendCommand('capture', 0)">Take Photo</button>
            <button class="exposure-button" onclick="refreshCapturedImage()">&#x21BA; Refresh Image</button>
        </div>
 
        <div class="camera-controls">
            <h2>Camera 1 Controls</h2>
            <!--<button class="exposure-button" onclick="sendCommand('exposeoutdoor', 1)">Daylight</button>
            <button class="exposure-button" onclick="sendCommand('exposeinside', 1)">Inside</button>
            <button class="exposure-button" onclick="sendCommand('capture', 1)">Take Photo</button>-->
        </div>
        
        <!-- System Controls -->
        <div class="camera-controls">
            <h2>System Controls</h2>
            <button id="shutdown-button" onclick="sendShutdownCommand()">
                &#x26D4; SHUTDOWN SYSTEM
            </button>
        </div>

        <!-- Fine Exposure Controls -->
        <div class="camera-controls">
            <h2>Fine Exposure Controls</h2>
            <div style="margin-bottom: 10px;">
                <label style="color: gray; margin-right: 10px;">Camera:</label>
                <select id="exposure-camera" style="background-color: #333; color: white; padding: 5px;">
                    <option value="0">Camera 0</option>
                    <option value="1">Camera 1</option>
                </select>
            </div>
            
            <div style="margin-bottom: 10px;">
                <label style="color: gray; margin-right: 10px;">EV:</label>
                <input type="number" id="ev-value" value="0" step="10" style="width: 60px; background-color: #333; color: white; padding: 5px;">
                <button onclick="sendExposureCommand('ev')" style="background-color: gray; color: white; padding: 5px; margin-left: 10px;">Set EV</button>
            </div>
            
            <div style="margin-bottom: 10px;">
                <label style="color: gray; margin-right: 10px;">Gain:</label>
                <input type="number" id="gain-value" value="100" step="10" style="width: 60px; background-color: #333; color: white; padding: 5px;">
                <button onclick="sendExposureCommand('gain')" style="background-color: gray; color: white; padding: 5px; margin-left: 10px;">Set Gain</button>
            </div>
            
            <div style="margin-bottom: 10px;">
                <label style="color: gray; margin-right: 10px;">Aperture:</label>
                <input type="number" id="aperture-value" value="200" step="10" style="width: 60px; background-color: #333; color: white; padding: 5px;">
                <button onclick="sendExposureCommand('aperture')" style="background-color: gray; color: white; padding: 5px; margin-left: 10px;">Set Aperture</button>
            </div>
        </div>

        <!-- Stepper Motor Controls -->
        <div class="camera-controls">
            <h2>Stepper Motor Controls</h2>
            <div style="margin-bottom: 10px;">
                <label style="color: gray; margin-right: 10px;">Pan Amount:</label>
                <input type="number" id="pan-amount" value="50" step="1" style="width: 80px; background-color: #333; color: white; padding: 5px;">
                <button onclick="sendStepperCommand('pan')" style="background-color: gray; color: white; padding: 5px; margin-left: 10px;">Pan Left</button>
                <button onclick="sendStepperCommand('pan', true)" style="background-color: gray; color: white; padding: 5px; margin-left: 5px;">Pan Right</button>
            </div>
            
            <div style="margin-bottom: 10px;">
                <label style="color: gray; margin-right: 10px;">Tilt Amount:</label>
                <input type="number" id="tilt-amount" value="50" step="1" style="width: 80px; background-color: #333; color: white; padding: 5px;">
                <button onclick="sendStepperCommand('tilt')" style="background-color: gray; color: white; padding: 5px; margin-left: 10px;">Tilt Up</button>
                <button onclick="sendStepperCommand('tilt', true)" style="background-color: gray; color: white; padding: 5px; margin-left: 5px;">Tilt Down</button>
            </div>
            
            <div style="margin-bottom: 10px;">
                <label style="color: gray; margin-right: 10px;">Click-to-Move:</label>
                <button onclick="toggleClickToMove()" id="click-to-move-btn" style="background-color: #4CAF50; color: white; padding: 5px; margin-left: 10px;">Enable Click-to-Move</button>
                <span id="click-status" style="color: gray; margin-left: 10px;">Disabled</span>
            </div>
        </div>

        <!-- Calibration Controls -->
        <div class="camera-controls" id="calibration-controls" style="display: none;">
            <h2>Calibration Controls</h2>
            <div style="margin-bottom: 10px;">
                <label style="color: gray; margin-right: 10px;">Grid Size:</label>
                <input type="number" id="grid-rows" value="3" min="2" max="10" style="width: 60px; background-color: #333; color: white; padding: 5px;">
                <span style="color: gray; margin: 0 5px;">x</span>
                <input type="number" id="grid-cols" value="3" min="2" max="10" style="width: 60px; background-color: #333; color: white; padding: 5px;">
                <button onclick="startCalibration()" style="background-color: #FF9800; color: white; padding: 5px; margin-left: 10px;">Start Calibration</button>
                <button onclick="saveCalibration()" style="background-color: #2196F3; color: white; padding: 5px; margin-left: 5px;">Save Calibration</button>
            </div>
            
            <div id="calibration-status" style="color: gray; margin-bottom: 10px;">
                Click on grid points in order to calibrate the mapping
            </div>
            
            <div id="calibration-progress" style="margin-bottom: 10px;">
                <div style="background-color: #333; height: 20px; border-radius: 10px; overflow: hidden;">
                    <div id="progress-bar" style="background-color: #4CAF50; height: 100%; width: 0%; transition: width 0.3s;"></div>
                </div>
                <span id="progress-text" style="color: gray; font-size: 12px;">0 / 0 points calibrated</span>
            </div>
        </div>

        <div class="half-panel" style="display:none">
            <h1>telemetry</h1>
        </div>
        <div class="half-panel">            
            <div class="half-panel"><button onclick="sendCommand('tilt', 150)">&#8681;</button></div>
            <div class="half-panel"><button onclick="sendCommand('tilt', -150)">&#8679;</button></div>
            
            <div class="half-panel"><button onclick="sendCommand('pan', 150)">&#8678;</button></div>
            <div class="half-panel"><button onclick="sendCommand('pan', -150)">&#8680;</button></div>

            <button class="hidden" onclick="sendCommand('tilt', 1)">Tilt Up</button>
            <button class="hidden" onclick="sendCommand('tilt', -1)">Tilt Down</button>
        </div>

        <textarea id="console">
            Console area...
        </textarea>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/mediamtx-webrtc-player@1.0.4/mediamtx-webrtc-player.min.js"></script>

    <div id="cam0-container">
        <video id="cam0-video" autoplay playsinline></video>
    </div>
    <div id="cam1-container">
        <video id="cam1-video" autoplay playsinline></video>
    </div>

    <script>
        var socket = new WebSocket("ws://frodo.local:8765");

        function connect(socket){
            socket.onopen = function(event) {
                writeToConsole("Connection opened");
            };

            socket.onmessage = function(event) {
                receiveResponse(event.data);
            };

            socket.onerror = function(error) {
                writeToConsole("Error: " + error.message);
            };

            socket.onclose = function(event) {
                writeToConsole("Connection closed: " + (event.wasClean ? "clean" : "unclean") +
                    ", Code: " + event.code + ", Reason: " + event.reason);

                // Attempt to reconnect after 2 seconds
                setTimeout(function() {
                    writeToConsole("Attempting to reconnect...");
                    connect();
                }, 3000);
            };
        }
        
        // Start the initial connection
        connect(socket);

        async function startWebRTC(videoElement, path) {
            // Don't try to reconnect if we're already connecting
            if (webrtcConnections[path] && webrtcConnections[path].connecting) {
                writeToConsole(`Already trying to connect ${path}, skipping...`);
                return;
            }

            const pc = new RTCPeerConnection({
                iceServers: []
            });

            // Get video element stream
            pc.ontrack = (event) => {
                if (event.track.kind === 'video') {
                    videoElement.srcObject = event.streams[0];
                }
            };

            // Handle connection state changes
            pc.onconnectionstatechange = () => {
                writeToConsole(`WebRTC connection state (${path}): ${pc.connectionState}`);
                if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                    writeToConsole(`WebRTC connection failed for ${path}, will retry...`);
                    // Set a longer delay for reconnection attempts
                    setTimeout(() => reconnectWebRTC(videoElement, path), 3000);
                }
            };

            // Create WebSocket connection
            const ws = new WebSocket(`ws://${window.location.hostname}:8889/${path}/webrtc`);

            ws.onmessage = async (ev) => {
                try {
                    const msg = JSON.parse(ev.data);
                    if (msg.type === 'answer') {
                        await pc.setRemoteDescription(msg);
                    } else if (msg.type === 'candidate') {
                        await pc.addIceCandidate(msg);
                    }
                } catch (e) {
                    writeToConsole(`WebRTC error (${path}): ${e.message}`);
                }
            };

            ws.onerror = (error) => {
                writeToConsole(`WebSocket error (${path}): Connection failed`);
                // Don't try to reconnect immediately on error
                webrtcConnections[path].connecting = false;
            };

            ws.onclose = () => {
                writeToConsole(`WebSocket closed (${path})`);
                // Only try to reconnect if we haven't already started a new connection
                if (webrtcConnections[path] && !webrtcConnections[path].connecting) {
                    setTimeout(() => reconnectWebRTC(videoElement, path), 3000);
                }
                webrtcConnections[path].connecting = false;
            };

            // Add transceivers and create offer
            pc.addTransceiver('video', {direction: 'recvonly'});
            pc.addTransceiver('audio', {direction: 'recvonly'});
            
            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // Wait for WebSocket to be ready
                if (ws.readyState === WebSocket.CONNECTING) {
                    await new Promise((resolve, reject) => {
                        ws.onopen = resolve;
                        setTimeout(() => reject(new Error('WebSocket connection timeout')), 5000);
                    });
                }

                // Send offer
                ws.send(JSON.stringify({
                    type: 'offer',
                    sdp: pc.localDescription.sdp
                }));

                // Store connection state
                webrtcConnections[path] = { pc, ws, connecting: false };
                return webrtcConnections[path];
            } catch (e) {
                writeToConsole(`WebRTC setup error (${path}): ${e.message}`);
                webrtcConnections[path] = { connecting: false };
                throw e;
            }
        }

        // Store WebRTC connections for cleanup
        const webrtcConnections = {
            cam0: null,
            cam1: null
        };

        async function reconnectWebRTC(videoElement, path) {
            try {
                // Don't try to reconnect if we're already connecting
                if (webrtcConnections[path] && webrtcConnections[path].connecting) {
                    writeToConsole(`Already reconnecting ${path}, skipping...`);
                    return;
                }

                writeToConsole(`Starting reconnection for ${path}...`);
                
                // Mark as connecting
                webrtcConnections[path] = { connecting: true };

                // Clean up existing connection
                if (webrtcConnections[path]) {
                    const { pc, ws } = webrtcConnections[path];
                    if (pc) {
                        pc.close();
                    }
                    if (ws && ws.readyState !== WebSocket.CLOSED) {
                        ws.close();
                    }
                }

                // Create new connection
                await startWebRTC(videoElement, path);
                writeToConsole(`Reconnection completed for ${path}`);
            } catch (e) {
                writeToConsole(`WebRTC reconnection error (${path}): ${e.message}`);
                // Mark as not connecting anymore
                if (webrtcConnections[path]) {
                    webrtcConnections[path].connecting = false;
                }
                // Try again after a longer delay
                setTimeout(() => reconnectWebRTC(videoElement, path), 3000);
            }
        }

        function sendCommand(command, value) {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(command + " " + value);
                writeToConsole("Sent: " + command + " " + value);
                
                // If this is a capture command, refresh the image after a delay
                if (command === 'capture') {
                    setTimeout(refreshCapturedImage, 2000); // Wait 2 seconds for photo to be saved
                }
            } else {
                writeToConsole("WebSocket is not connected");
            }
        }

        function sendExposureCommand(type) {
            const camera = document.getElementById('exposure-camera').value;
            let value;
            
            switch(type) {
                case 'ev':
                    value = document.getElementById('ev-value').value;
                    break;
                case 'gain':
                    value = document.getElementById('gain-value').value;
                    break;
                case 'aperture':
                    value = document.getElementById('aperture-value').value;
                    break;
            }
            
            sendCommand(type, value + " " + camera);
        }

        function sendStepperCommand(type, reverse = false) {
            const amount = document.getElementById(`${type}-amount`).value;
            const direction = reverse ? -1 : 1;
            const value = direction * parseInt(amount);
            sendCommand(type, value);
        }

        function sendShutdownCommand() {
            if (confirm("Are you sure you want to shutdown the system? This will stop all camera streams and processes.")) {
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send("shutdown");
                    writeToConsole("Sent: shutdown command");
                    
                    // Disable the shutdown button to prevent multiple clicks
                    const shutdownButton = document.getElementById('shutdown-button');
                    shutdownButton.disabled = true;
                    shutdownButton.innerHTML = "&#x21BA; SHUTTING DOWN...";
                    shutdownButton.style.backgroundColor = "#666";
                    
                    // Show shutdown message
                    writeToConsole("System shutdown initiated...");
                } else {
                    writeToConsole("WebSocket is not connected - cannot send shutdown command");
                }
            }
        }

        function receiveResponse(response){
            writeToConsole(response)
        }

        function writeToConsole(str){
            var consoleArea = document.getElementById('console');
            consoleArea.value += "\n" + str;
            consoleArea.scrollTop = consoleArea.scrollHeight; // Scroll to the bottom
        }

        function refreshCapturedImage() {
            const lastCaptureImg = document.getElementById('last-capture');
            const currentSrc = lastCaptureImg.src;
            
            // Remove any existing timestamp parameters and add a new one
            let newSrc = currentSrc;
            
            // Remove existing timestamp parameters
            newSrc = newSrc.replace(/[?&]t=\d+/g, '');
            
            // Add new timestamp parameter
            const separator = newSrc.includes('?') ? '&' : '?';
            newSrc = newSrc + separator + 't=' + Date.now();
            
            lastCaptureImg.src = newSrc;
            
            writeToConsole("Refreshing captured image...");
        }

        // Click-to-Move and Calibration Variables
        let clickToMoveEnabled = false;
        let calibrationMode = false;
        let calibrationPoints = [];
        let currentCalibrationPoint = 0;
        let totalCalibrationPoints = 0;
        let stepperMapping = null;

        // Add click event listener to overlay instead of iframe
        function setupClickToMove() {
            const overlay = document.getElementById('cam1-overlay');
            if (overlay) {
                overlay.addEventListener('click', handleCam1Click);
                overlay.style.display = clickToMoveEnabled ? 'block' : 'none';
                writeToConsole("Click-to-move enabled for cam1 overlay");
            }
        }

        function handleCam1Click(event) {
            if (!clickToMoveEnabled) return;
            
            const overlay = event.target;
            const rect = overlay.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            // Normalize coordinates to 0-1 range
            const normalizedX = x / rect.width;
            const normalizedY = y / rect.height;
            
            // Add visual feedback
            showClickIndicator(x, y);
            
            if (calibrationMode) {
                handleCalibrationClick(normalizedX, normalizedY);
            } else {
                handleMoveClick(normalizedX, normalizedY);
            }
        }

        function showClickIndicator(x, y) {
            // Create a temporary visual indicator
            const indicator = document.createElement('div');
            indicator.style.cssText = `
                position: absolute;
                left: ${x}px;
                top: ${y}px;
                width: 10px;
                height: 10px;
                background: red;
                border-radius: 50%;
                pointer-events: none;
                z-index: 20;
                transform: translate(-50%, -50%);
            `;
            
            const overlay = document.getElementById('cam1-overlay');
            overlay.appendChild(indicator);
            
            // Remove indicator after 1 second
            setTimeout(() => {
                if (indicator.parentNode) {
                    indicator.parentNode.removeChild(indicator);
                }
            }, 1000);
        }

        function handleMoveClick(x, y) {
            if (!stepperMapping) {
                writeToConsole("No calibration data available. Please calibrate first.");
                return;
            }
            
            try {
                const [panSteps, tiltSteps] = stepperMapping.get_steps(x, y);
                writeToConsole(`Moving to (${x.toFixed(3)}, ${y.toFixed(3)}) - Pan: ${panSteps}, Tilt: ${tiltSteps}`);
                
                // Send pan and tilt commands
                sendCommand('pan', panSteps);
                sendCommand('tilt', tiltSteps);
            } catch (error) {
                writeToConsole(`Error calculating steps: ${error.message}`);
            }
        }

        function toggleClickToMove() {
            clickToMoveEnabled = !clickToMoveEnabled;
            const btn = document.getElementById('click-to-move-btn');
            const status = document.getElementById('click-status');
            const calibrationControls = document.getElementById('calibration-controls');
            const overlay = document.getElementById('cam1-overlay');
            
            if (clickToMoveEnabled) {
                btn.textContent = 'Disable Click-to-Move';
                btn.style.backgroundColor = '#f44336';
                status.textContent = 'Enabled';
                status.style.color = '#4CAF50';
                calibrationControls.style.display = 'block';
                overlay.style.display = 'block';
                setupClickToMove();
            } else {
                btn.textContent = 'Enable Click-to-Move';
                btn.style.backgroundColor = '#4CAF50';
                status.textContent = 'Disabled';
                status.style.color = 'gray';
                calibrationControls.style.display = 'none';
                overlay.style.display = 'none';
                if (calibrationMode) {
                    stopCalibration();
                }
            }
        }

        function startCalibration() {
            const rows = parseInt(document.getElementById('grid-rows').value);
            const cols = parseInt(document.getElementById('grid-cols').value);
            
            calibrationMode = true;
            calibrationPoints = [];
            currentCalibrationPoint = 0;
            totalCalibrationPoints = rows * cols;
            
            updateCalibrationProgress();
            updateCalibrationStatus(`Click on grid point ${currentCalibrationPoint + 1} of ${totalCalibrationPoints}`);
            
            writeToConsole(`Starting calibration with ${rows}x${cols} grid (${totalCalibrationPoints} points)`);
        }

        function handleCalibrationClick(x, y) {
            if (!calibrationMode) return;
            
            // Calculate grid position
            const rows = parseInt(document.getElementById('grid-rows').value);
            const cols = parseInt(document.getElementById('grid-cols').value);
            const row = Math.floor(currentCalibrationPoint / cols);
            const col = currentCalibrationPoint % cols;
            
            // Store calibration point (x, y, pan_steps, tilt_steps)
            // For now, we'll use simple linear mapping - you can improve this
            const panSteps = Math.round((x - 0.5) * 1000); // -500 to 500 steps
            const tiltSteps = Math.round((0.5 - y) * 1000); // -500 to 500 steps
            
            calibrationPoints.push([x, y, panSteps, tiltSteps]);
            
            writeToConsole(`Calibration point ${currentCalibrationPoint + 1}: (${x.toFixed(3)}, ${y.toFixed(3)}) -> Pan: ${panSteps}, Tilt: ${tiltSteps}`);
            
            currentCalibrationPoint++;
            updateCalibrationProgress();
            
            if (currentCalibrationPoint >= totalCalibrationPoints) {
                finishCalibration();
            } else {
                updateCalibrationStatus(`Click on grid point ${currentCalibrationPoint + 1} of ${totalCalibrationPoints}`);
            }
        }

        function finishCalibration() {
            calibrationMode = false;
            updateCalibrationStatus('Calibration complete! Click "Save Calibration" to store the mapping.');
            writeToConsole('Calibration completed successfully');
            
            // Create stepper mapping object
            const rows = parseInt(document.getElementById('grid-rows').value);
            const cols = parseInt(document.getElementById('grid-cols').value);
            stepperMapping = new StepperMapping(calibrationPoints, [rows, cols]);
        }

        function stopCalibration() {
            calibrationMode = false;
            updateCalibrationStatus('Calibration cancelled');
            writeToConsole('Calibration cancelled');
        }

        function updateCalibrationProgress() {
            const progress = (currentCalibrationPoint / totalCalibrationPoints) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('progress-text').textContent = `${currentCalibrationPoint} / ${totalCalibrationPoints} points calibrated`;
        }

        function updateCalibrationStatus(message) {
            document.getElementById('calibration-status').textContent = message;
        }

        function saveCalibration() {
            if (!stepperMapping) {
                writeToConsole('No calibration data to save');
                return;
            }
            
            // Save to localStorage for now - you can extend this to save to server
            const calibrationData = {
                points: calibrationPoints,
                gridShape: [parseInt(document.getElementById('grid-rows').value), parseInt(document.getElementById('grid-cols').value)],
                timestamp: Date.now()
            };
            
            localStorage.setItem('stepperCalibration', JSON.stringify(calibrationData));
            writeToConsole('Calibration saved to browser storage');
        }

        function loadCalibration() {
            const saved = localStorage.getItem('stepperCalibration');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    calibrationPoints = data.points;
                    document.getElementById('grid-rows').value = data.gridShape[0];
                    document.getElementById('grid-cols').value = data.gridShape[1];
                    stepperMapping = new StepperMapping(calibrationPoints, data.gridShape);
                    writeToConsole('Calibration loaded from storage');
                } catch (error) {
                    writeToConsole('Error loading calibration: ' + error.message);
                }
            }
        }

        // Simple StepperMapping class (you can replace this with your existing one)
        class StepperMapping {
            constructor(calibrationPoints, gridShape) {
                this.points = calibrationPoints;
                this.gridShape = gridShape;
            }
            
            get_steps(x, y) {
                // Simple nearest neighbor interpolation for now
                // You can implement bilinear interpolation as in your StepperMapping.py
                let minDist = Infinity;
                let bestPoint = null;
                
                for (const point of this.points) {
                    const [px, py, panSteps, tiltSteps] = point;
                    const dist = Math.sqrt((x - px) ** 2 + (y - py) ** 2);
                    if (dist < minDist) {
                        minDist = dist;
                        bestPoint = point;
                    }
                }
                
                if (bestPoint) {
                    return [bestPoint[2], bestPoint[3]]; // pan, tilt steps
                }
                
                return [0, 0];
            }
        }

        // Load calibration on page load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Detect HTTP server port and update image source
                await detectAndUpdatePort();
                
                await startWebRTC(document.getElementById('cam0-video'), 'cam0');
                await startWebRTC(document.getElementById('cam1-video'), 'cam1');
                
                // Load saved calibration
                loadCalibration();
            } catch (e) {
                console.error('Error starting WebRTC:', e);
            }
        });

        async function detectAndUpdatePort() {
            // Try to detect the HTTP server port
            const ports = [8000, 8001, 8002, 8003, 8004];
            
            for (const port of ports) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 1000);
                    
                    const response = await fetch(`http://frodo.local:${port}/port-info`, {
                        method: 'GET',
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        const data = await response.json();
                        const detectedPort = data.port;
                        
                        // Update the image source
                        const lastCaptureImg = document.getElementById('last-capture');
                        lastCaptureImg.src = `http://frodo.local:${detectedPort}/captures/cam0_last.jpg`;
                        
                        writeToConsole(`HTTP server detected on port ${detectedPort}`);
                        return;
                    }
                } catch (e) {
                    // Continue to next port
                    continue;
                }
            }
            
            // If no port detected, keep default (8000)
            writeToConsole("Could not detect HTTP server port, using default (8000)");
        }
    </script>
