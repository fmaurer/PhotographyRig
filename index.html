<html>
<head>
    <title>Star and Moon Photography</title>

        }

            width:800px;

        }

            display: block;

            background-color: gray;
            font-size: 15px;
            text-transform: uppercase;

        .half-panel .hidden{

        }

        }

        #console {
            background-color:black;
            color:white;
            width: 794px;
            height: 161px;
            border-top: 24px solid #dedede;
        }

        #shutdown-button {
            background-color: #b80000 !important;
            color: white !important;
            padding: 15px 30px !important;
            font-size: 18px !important;
            font-weight: bold !important;
            border: none !important;
            border-radius: 5px !important;
            cursor: pointer !important;
            margin: 10px 0 !important;
            transition: all 0.3s ease !important;

        #shutdown-button:hover {
            background-color: #8b0000 !important;

        }

        #shutdown-button:disabled {
            background-color: #666 !important;
            cursor: not-allowed !important;
            transform: none !important;
            box-shadow: none !important;
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/mediamtx-webrtc-player@1.0.4/mediamtx-webrtc-player.min.js"></script>

    <div id="cam0-container">
        <video id="cam0-video" autoplay playsinline></video>
    </div>
    <div id="cam1-container">
        <video id="cam1-video" autoplay playsinline></video>
    </div>

    <script>
        var socket = new WebSocket("ws://frodo.local:8765");

        function connect(socket){
            socket.onopen = function(event) {
                writeToConsole("Connection opened");
            };

            socket.onmessage = function(event) {
                receiveResponse(event.data);
            };

            socket.onerror = function(error) {
                writeToConsole("Error: " + error.message);
            };

            socket.onclose = function(event) {
                writeToConsole("Connection closed: " + (event.wasClean ? "clean" : "unclean") +
                    ", Code: " + event.code + ", Reason: " + event.reason);

                // Attempt to reconnect after 2 seconds
                setTimeout(function() {
                    writeToConsole("Attempting to reconnect...");
                    connect();
                }, 3000);
            };
        }
        
        // Start the initial connection
        connect(socket);

        async function startWebRTC(videoElement, path) {
            // Don't try to reconnect if we're already connecting
            if (webrtcConnections[path] && webrtcConnections[path].connecting) {
                writeToConsole(`Already trying to connect ${path}, skipping...`);
                return;
            }

            const pc = new RTCPeerConnection({
                iceServers: []
            });

            // Get video element stream
            pc.ontrack = (event) => {
                if (event.track.kind === 'video') {
                    videoElement.srcObject = event.streams[0];
                }
            };

            // Handle connection state changes
            pc.onconnectionstatechange = () => {
                writeToConsole(`WebRTC connection state (${path}): ${pc.connectionState}`);
                if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
                    writeToConsole(`WebRTC connection failed for ${path}, will retry...`);
                    // Set a longer delay for reconnection attempts
                    setTimeout(() => reconnectWebRTC(videoElement, path), 3000);
                }
            };

            // Create WebSocket connection
            const ws = new WebSocket(`ws://${window.location.hostname}:8889/${path}/webrtc`);

            ws.onmessage = async (ev) => {
                try {
                    const msg = JSON.parse(ev.data);
                    if (msg.type === 'answer') {
                        await pc.setRemoteDescription(msg);
                    } else if (msg.type === 'candidate') {
                        await pc.addIceCandidate(msg);
                    }
                } catch (e) {
                    writeToConsole(`WebRTC error (${path}): ${e.message}`);
                }
            };

            ws.onerror = (error) => {
                writeToConsole(`WebSocket error (${path}): Connection failed`);
                // Don't try to reconnect immediately on error
                webrtcConnections[path].connecting = false;
            };

            ws.onclose = () => {
                writeToConsole(`WebSocket closed (${path})`);
                // Only try to reconnect if we haven't already started a new connection
                if (webrtcConnections[path] && !webrtcConnections[path].connecting) {
                    setTimeout(() => reconnectWebRTC(videoElement, path), 3000);
                }
                webrtcConnections[path].connecting = false;
            };

            // Add transceivers and create offer
            pc.addTransceiver('video', {direction: 'recvonly'});
            pc.addTransceiver('audio', {direction: 'recvonly'});
            
            try {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // Wait for WebSocket to be ready
                if (ws.readyState === WebSocket.CONNECTING) {
                    await new Promise((resolve, reject) => {
                        ws.onopen = resolve;
                        setTimeout(() => reject(new Error('WebSocket connection timeout')), 5000);
                    });
                }

                // Send offer
                ws.send(JSON.stringify({
                    type: 'offer',
                    sdp: pc.localDescription.sdp
                }));

                // Store connection state
                webrtcConnections[path] = { pc, ws, connecting: false };
                return webrtcConnections[path];
            } catch (e) {
                writeToConsole(`WebRTC setup error (${path}): ${e.message}`);
                webrtcConnections[path] = { connecting: false };
                throw e;
            }
        }

        // Store WebRTC connections for cleanup
        const webrtcConnections = {
            cam0: null,
            cam1: null
        };

        async function reconnectWebRTC(videoElement, path) {
            try {
                // Don't try to reconnect if we're already connecting
                if (webrtcConnections[path] && webrtcConnections[path].connecting) {
                    writeToConsole(`Already reconnecting ${path}, skipping...`);
                    return;
                }

                writeToConsole(`Starting reconnection for ${path}...`);
                
                // Mark as connecting
                webrtcConnections[path] = { connecting: true };

                // Clean up existing connection
                if (webrtcConnections[path]) {
                    const { pc, ws } = webrtcConnections[path];
                    if (pc) {
                        pc.close();
                    }
                    if (ws && ws.readyState !== WebSocket.CLOSED) {
                        ws.close();
                    }
                }

                // Create new connection
                await startWebRTC(videoElement, path);
                writeToConsole(`Reconnection completed for ${path}`);
            } catch (e) {
                writeToConsole(`WebRTC reconnection error (${path}): ${e.message}`);
                // Mark as not connecting anymore
                if (webrtcConnections[path]) {
                    webrtcConnections[path].connecting = false;
                }
                // Try again after a longer delay
                setTimeout(() => reconnectWebRTC(videoElement, path), 3000);
            }
        }

        function sendCommand(command, value) {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(command + " " + value);
                writeToConsole("Sent: " + command + " " + value);
                
                // If this is a capture command, refresh the image after a delay
                if (command === 'capture') {
                    setTimeout(refreshCapturedImage, 2000); // Wait 2 seconds for photo to be saved
                }
            } else {
                writeToConsole("WebSocket is not connected");
            }
        }

        function sendStepperCommand(type, reverse = false) {
            const amount = document.getElementById(`${type}-amount`).value;
            const direction = reverse ? -1 : 1;
            const value = direction * parseInt(amount);
            
            sendCommand(type, value);
        }

        function sendCustomAccel() {
            const accelRate = document.getElementById('accel-rate').value;
            const decelRate = document.getElementById('decel-rate').value;
            
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(`accel_custom ${accelRate} ${decelRate}`);
                writeToConsole(`Sent: accel_custom ${accelRate} ${decelRate}`);
            } else {
                writeToConsole("WebSocket is not connected");
            }
        }

        function sendMaxSpeed() {
            const maxSpeedDelay = document.getElementById('max-speed').value;
            
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(`max_speed ${maxSpeedDelay}`);
                writeToConsole(`Sent: max_speed ${maxSpeedDelay}`);
            } else {
                writeToConsole("WebSocket is not connected");
            }
        }

        function sendShutdownCommand() {
            if (confirm("Are you sure you want to shutdown the system? This will stop all camera streams and processes.")) {
                if (socket.readyState === WebSocket.OPEN) {
                    socket.send("shutdown");
                    writeToConsole("Sent: shutdown command");
                    
                    // Disable the shutdown button to prevent multiple clicks
                    const shutdownButton = document.getElementById('shutdown-button');
                    shutdownButton.disabled = true;
                    shutdownButton.innerHTML = "&#x21BA; SHUTTING DOWN...";
                    shutdownButton.style.backgroundColor = "#666";
                    
                    // Show shutdown message
                    writeToConsole("System shutdown initiated...");
                } else {
                    writeToConsole("WebSocket is not connected - cannot send shutdown command");
                }
            }
        }

        function receiveResponse(response){
            writeToConsole(response)
        }

        function writeToConsole(str){
            var consoleArea = document.getElementById('console');
            consoleArea.value += "\n" + str;
            consoleArea.scrollTop = consoleArea.scrollHeight; // Scroll to the bottom
        }

        function refreshCapturedImage() {
            const lastCaptureImg = document.getElementById('last-capture');
            const currentSrc = lastCaptureImg.src;
            
            // Remove any existing timestamp parameters and add a new one
            let newSrc = currentSrc;
            
            // Remove existing timestamp parameters
            newSrc = newSrc.replace(/[?&]t=\d+/g, '');
            
            // Add new timestamp parameter
            const separator = newSrc.includes('?') ? '&' : '?';
            newSrc = newSrc + separator + 't=' + Date.now();
            
            lastCaptureImg.src = newSrc;
            
            writeToConsole("Refreshing captured image...");
        }

        // Click-to-Move Variables
        let clickToMoveEnabled = false;
        let stepperMapping = null;

        // Add click event listener to overlay instead of iframe
        function setupClickToMove() {
            const overlay = document.getElementById('cam1-overlay');
            if (overlay) {
                overlay.addEventListener('click', handleCam1Click);
                overlay.style.display = clickToMoveEnabled ? 'block' : 'none';
                writeToConsole("Click-to-move enabled for cam1 overlay");
            }
        }

        function handleCam1Click(event) {
            if (!clickToMoveEnabled) return;
            
            const overlay = event.target;
            const rect = overlay.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;
            
            // Normalize coordinates to 0-1 range
            const normalizedX = x / rect.width;
            const normalizedY = y / rect.height;
            
            // Add visual feedback
            showClickIndicator(x, y);
            
            // Calculate offset between red zoom indicator and center
            const redDiv = document.getElementById('red-zoom-indicator');
            const greenDiv = document.getElementById('green-center-indicator');
            const streamContainer = document.getElementById('stream-container');
            
            if (redDiv && greenDiv && streamContainer) {
                const redRect = redDiv.getBoundingClientRect();
                const containerRect = streamContainer.getBoundingClientRect();
                
                // Get the cam1 iframe to calculate offset relative to it
                const cam1Iframe = streamContainer.querySelector('iframe');
                const iframeRect = cam1Iframe.getBoundingClientRect();
                
                // Debug: log all the coordinate values
                writeToConsole(`Debug - Container: left=${containerRect.left}, top=${containerRect.top}, width=${containerRect.width}, height=${containerRect.height}`);
                writeToConsole(`Debug - Cam1 iframe: left=${iframeRect.left}, top=${iframeRect.top}, width=${iframeRect.width}, height=${iframeRect.height}`);
                writeToConsole(`Debug - Red div: left=${redRect.left}, top=${redRect.top}, width=${redRect.width}, height=${redRect.height}`);
                
                // Calculate center of cam1 iframe (not the entire container)
                const iframeCenterX = iframeRect.width / 2;
                const iframeCenterY = iframeRect.height / 2;
                
                // Calculate offset of red div from center of cam1 iframe
                const redCenterX = (redRect.left - iframeRect.left) + redRect.width/2;
                const redCenterY = (redRect.top - iframeRect.top) + redRect.height/2;
                
                const offsetX = redCenterX - iframeCenterX;
                const offsetY = redCenterY - iframeCenterY;
                
                writeToConsole(`Debug - Iframe center: (${iframeCenterX}, ${iframeCenterY})`);
                writeToConsole(`Debug - Red center: (${redCenterX}, ${redCenterY})`);
                
                // Apply offset to clicked coordinates (inverse because we want red div to center on click)
                const adjustedX = x - (offsetX);
                const adjustedY = y - (offsetY);
                
                // Scale coordinates since video is 3.5x smaller rendered on screen than 1280x720 stream
                const scaledX = (adjustedX / rect.width) * 1280; // Scale to full 1280x720 resolution
                const scaledY = (adjustedY / rect.height) * 720;
                
                writeToConsole(`Click offset: (${offsetX.toFixed(1)}, ${offsetY.toFixed(1)}) - Adjusted: (${adjustedX.toFixed(1)}, ${adjustedY.toFixed(1)})`);
                
                handleMoveClick(scaledX, scaledY);
            } else {
                // Fallback to original behavior if divs not found
                const scaledX = normalizedX * 1280;
                const scaledY = normalizedY * 720;
                handleMoveClick(scaledX, scaledY);
            }
        }

        function showClickIndicator(x, y) {
            // Create a temporary visual indicator
            const indicator = document.createElement('div');
            indicator.style.cssText = `
                position: absolute;
                left: ${x}px;
                top: ${y}px;
                width: 10px;
                height: 10px;
                background: red;
                border-radius: 50%;
                pointer-events: none;
                z-index: 20;
                transform: translate(-50%, -50%);
            `;
            
            const overlay = document.getElementById('cam1-overlay');
            overlay.appendChild(indicator);
            
            // Remove indicator after 1 second
            setTimeout(() => {
                if (indicator.parentNode) {
                    indicator.parentNode.removeChild(indicator);
                }
            }, 1000);
        }

        function handleMoveClick(x, y) {
            if (!stepperMapping) {
                writeToConsole("No calibration data available. Loading lookup image...");
                loadStepperMapping();
                return;
            }
            
            try {
                const [yaw, pitch] = stepperMapping.get_angles(x, y);
                writeToConsole(`Clicked at (${x.toFixed(1)}, ${y.toFixed(1)}) - Yaw: ${yaw.toFixed(2)} deg, Pitch: ${pitch.toFixed(2)} deg`);
                
                // Convert angles to steps using hardcoded conversion values
                const pitchStepsPerDegree = 805;
                const yawStepsPerDegree = 2146;
                
                // Invert the angles to fix the inverted movement
                const panSteps = Math.round(-yaw * yawStepsPerDegree);
                const tiltSteps = Math.round(-pitch * pitchStepsPerDegree);
                
                // Send pan and tilt commands
                sendCommand('pan', panSteps);
                sendCommand('tilt', tiltSteps);
            } catch (error) {
                writeToConsole(`Error calculating angles: ${error.message}`);
            }
        }

        function toggleClickToMove() {
            clickToMoveEnabled = !clickToMoveEnabled;
            const btn = document.getElementById('click-to-move-btn');
            const status = document.getElementById('click-status');
            const overlay = document.getElementById('cam1-overlay');
            
            if (clickToMoveEnabled) {
                btn.textContent = 'Disable Click-to-Move';
                btn.style.backgroundColor = '#f44336';
                status.textContent = 'Enabled';
                status.style.color = '#4CAF50';
                overlay.style.display = 'block';
                setupClickToMove();
                
                // Load stepper mapping if not already loaded
                if (!stepperMapping) {
                    loadStepperMapping();
                }
            } else {
                btn.textContent = 'Enable Click-to-Move';
                btn.style.backgroundColor = '#4CAF50';
                status.textContent = 'Disabled';
                status.style.color = 'gray';
                overlay.style.display = 'none';
            }
        }

        // New StepperMapping class that uses lookup image
        class StepperMapping {
            constructor() {
                this.lookupImage = null;
                this.canvas = null;
                this.ctx = null;
                this.loaded = false;
                this.HFOV_DEG = 42;
                this.VFOV_DEG = 20;
            }
            
            async loadLookupImage() {
                try {
                    // Create a canvas to load and process the image
                    this.canvas = document.createElement('canvas');
                    this.ctx = this.canvas.getContext('2d');
                    
                    // Create an image element to load the lookup image
                    const img = new Image();
                    img.crossOrigin = 'anonymous'; // Handle CORS if needed
                    
                    return new Promise((resolve, reject) => {
                        img.onload = () => {
                            this.canvas.width = img.width;
                            this.canvas.height = img.height;
                            this.ctx.drawImage(img, 0, 0);
                            this.loaded = true;
                            writeToConsole(`Loaded lookup image: ${img.width}x${img.height}`);
                            resolve();
                        };
                        
                        img.onerror = () => {
                            reject(new Error('Failed to load lookup image'));
                        };
                        
                        // Load the lookup image from the cameracalibration directory
                        img.src = 'cameracalibration/angle_lookup.png';
                        writeToConsole('Loading lookup image from cameracalibration/angle_lookup.png...');
                    });
                } catch (error) {
                    writeToConsole(`Error loading lookup image: ${error.message}`);
                    throw error;
                }
            }
            
            decode_angle(r, g) {
                // Decode angles from RGB values (matching the Python implementation)
                const yaw = (r / 255.0) * this.HFOV_DEG - this.HFOV_DEG / 2;
                const pitch = (g / 255.0) * this.VFOV_DEG - this.VFOV_DEG / 2;
                return [yaw, pitch];
            }
            
            get_angles(x, y) {
                if (!this.loaded) {
                    throw new Error('Lookup image not loaded');
                }
                
                // Clamp coordinates to image bounds
                const clampedX = Math.max(0, Math.min(this.canvas.width - 1, Math.round(x)));
                const clampedY = Math.max(0, Math.min(this.canvas.height - 1, Math.round(y)));
                
                // Get pixel data at the specified coordinates
                const pixelData = this.ctx.getImageData(clampedX, clampedY, 1, 1).data;
                
                // OpenCV loads BGR, so we need to access the correct channels
                // Based on the pixel values, yaw is in blue channel, pitch in green channel
                const b = pixelData[0]; // Blue channel (yaw) - appears to contain yaw data
                const g = pixelData[1]; // Green channel (pitch)
                
                // Debug: log the pixel values
                writeToConsole(`Pixel at (${clampedX}, ${clampedY}): R=${pixelData[2]}, G=${g}, B=${b}`);
                
                // Decode the angles - use blue for yaw, green for pitch
                const [yaw, pitch] = this.decode_angle(b, g);
                
                return [yaw, pitch]; // Return yaw, pitch (matching the Python implementation)
            }
        }

        async function loadStepperMapping() {
            try {
                stepperMapping = new StepperMapping();
                await stepperMapping.loadLookupImage();
                writeToConsole('Stepper mapping loaded successfully');
                
                // Test center pixel to verify channel ordering
                const centerX = Math.round(stepperMapping.canvas.width / 2);
                const centerY = Math.round(stepperMapping.canvas.height / 2);
                const [centerYaw, centerPitch] = stepperMapping.get_angles(centerX, centerY);
                writeToConsole(`Center pixel test (${centerX}, ${centerY}): Yaw=${centerYaw.toFixed(2)} deg, Pitch=${centerPitch.toFixed(2)} deg (should be close to 0,0)`);
                
            } catch (error) {
                writeToConsole(`Failed to load stepper mapping: ${error.message}`);
                stepperMapping = null;
            }
        }

        // Test function to verify lookup image is working
        async function testLookupImage() {
            try {
                if (!stepperMapping) {
                    await loadStepperMapping();
                }
                
                if (stepperMapping && stepperMapping.loaded) {
                    // Test center of image
                    const centerX = stepperMapping.canvas.width / 2;
                    const centerY = stepperMapping.canvas.height / 2;
                    const [yaw, pitch] = stepperMapping.get_angles(centerX, centerY);
                    writeToConsole(`Center test (${centerX}, ${centerY}): Yaw=${yaw.toFixed(2)} deg, Pitch=${pitch.toFixed(2)} deg`);
                    
                    // Test corners
                    const [yawTL, pitchTL] = stepperMapping.get_angles(0, 0);
                    const [yawTR, pitchTR] = stepperMapping.get_angles(stepperMapping.canvas.width - 1, 0);
                    const [yawBL, pitchBL] = stepperMapping.get_angles(0, stepperMapping.canvas.height - 1);
                    const [yawBR, pitchBR] = stepperMapping.get_angles(stepperMapping.canvas.width - 1, stepperMapping.canvas.height - 1);
                    
                    writeToConsole(`Top-left: Yaw=${yawTL.toFixed(2)} deg, Pitch=${pitchTL.toFixed(2)} deg`);
                    writeToConsole(`Top-right: Yaw=${yawTR.toFixed(2)} deg, Pitch=${pitchTR.toFixed(2)} deg`);
                    writeToConsole(`Bottom-left: Yaw=${yawBL.toFixed(2)} deg, Pitch=${pitchBL.toFixed(2)} deg`);
                    writeToConsole(`Bottom-right: Yaw=${yawBR.toFixed(2)} deg, Pitch=${pitchBR.toFixed(2)} deg`);
                } else {
                    writeToConsole('Stepper mapping not loaded');
                }
            } catch (error) {
                writeToConsole(`Test failed: ${error.message}`);
            }
        }

        // Load calibration on page load
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Detect HTTP server port and update image source
                await detectAndUpdatePort();
                
                await startWebRTC(document.getElementById('cam0-video'), 'cam0');
                await startWebRTC(document.getElementById('cam1-video'), 'cam1');
                
                // Load stepper mapping
                await loadStepperMapping();
            } catch (e) {
                console.error('Error starting WebRTC:', e);
            }
        });

        async function detectAndUpdatePort() {
            // Try to detect the HTTP server port
            const ports = [8000, 8001, 8002, 8003, 8004];
            
            for (const port of ports) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 1000);
                    
                    const response = await fetch(`http://frodo.local:${port}/port-info`, {
                        method: 'GET',
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        const data = await response.json();
                        const detectedPort = data.port;
                        
                        // Update the image source
                        const lastCaptureImg = document.getElementById('last-capture');
                        lastCaptureImg.src = `http://frodo.local:${detectedPort}/captures/cam0_last.jpg`;
                        
                        writeToConsole(`HTTP server detected on port ${detectedPort}`);
                        return;
                    }
                } catch (e) {
                    // Continue to next port
                    continue;
                }
            }
            
            // If no port detected, keep default (8000)
            writeToConsole("Could not detect HTTP server port, using default (8000)");
        }
    </script>
